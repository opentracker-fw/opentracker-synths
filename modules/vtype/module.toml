# OpenTracker module manifest (read by the core's tools/profile.py).
id      = "VTY1"
name    = "V-Type synth"
version = "1.0.0"
api     = 1
entry   = "vtypeModule"
caps    = ["synthEngine"]
sources = ["vtype.cpp", "vtype_desc.cpp", "vtype_module.cpp"]
tests   = ["engine_vtype_test.cpp"]

flash_max_bytes   = 24000             # vtype.otm 21,976 B with its hot row (image 20,656 B)
sram_audio_bytes  = 0                 # no static buffers
sdram_bytes       = 0
fastrun_bytes     = 0
cpu_insn_per_unit = 45000             # bench-m4 limit per voice (vtype.unit 43,491: the costliest path of vtype.scan, note 127 + Key Shift 24, osc 2 +36)
max_units         = 6
bench             = "vtype"
engines           = [139]             # 0x8B: a module engine (not a Tracker Mini model)
bench_sources     = ["vtype_bench.cpp"]
bench_entry       = "vtypeBench"
