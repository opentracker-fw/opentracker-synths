# OpenTracker module manifest (core: tools/profile.py): the DX7 engine, six-
# operator FM playing DX7 .syx voices. Derived from msfa (Apache 2.0, msfa.txt
# in this folder).
id      = "DX7S"
name    = "DX7 synth"
version = "1.0.0"
api     = 1
entry   = "dx7Module"
caps    = ["synthEngine"]
sources = ["dx7.cpp", "dx7_tables.cpp", "dx7_patch.cpp", "dx7_desc.cpp", "dx7_module.cpp"]
tests   = ["engine_dx7_test.cpp"]

flash_max_bytes   = 19500
sram_audio_bytes  = 6120              # the sine table (dx7_tables.h gDx7Sin) + 8 voices x 252 B (dx7.cpp gVoices)
sdram_bytes       = 0
fastrun_bytes     = 0
cpu_insn_per_unit = 22000             # bench limit per voice (algorithm 4 / 6 feedback chain)
max_units         = 8
engines           = [140]             # 0x8C: a module engine (not a Tracker Mini model)
